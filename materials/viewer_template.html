<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Materials Discovery Lab</title>
<style>
:root{
  --bg:#eef1f4;--panel:rgba(255,255,255,.86);--panel-solid:#fff;--ink:#14191d;--muted:#5b6670;--line:#d4dbe1;
  --accent:#0f6e66;--accent-soft:#d8eeea;--warn:#b26a06;--bad:#b3372b;--good:#1d7f56;
  --scene-bg:#e9edf1;--grid:#c3ccd4;--glass:rgba(255,255,255,.72);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070b10;--panel:rgba(14,20,26,.84);--panel-solid:#0e141a;--ink:#e6ecef;--muted:#93a1a8;--line:#24313a;
  --accent:#45c2b3;--accent-soft:#12342f;--warn:#e7a640;--bad:#f07a6c;--good:#4cc38a;
  --scene-bg:#05080c;--grid:#1c2730;--glass:rgba(10,15,20,.66);
}}
:root[data-theme="dark"]{
  --bg:#070b10;--panel:rgba(14,20,26,.84);--panel-solid:#0e141a;--ink:#e6ecef;--muted:#93a1a8;--line:#24313a;
  --accent:#45c2b3;--accent-soft:#12342f;--warn:#e7a640;--bad:#f07a6c;--good:#4cc38a;
  --scene-bg:#05080c;--grid:#1c2730;--glass:rgba(10,15,20,.66);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
header{position:fixed;top:14px;left:16px;right:16px;display:flex;gap:12px;align-items:flex-start;pointer-events:none;z-index:5}
.brand{pointer-events:auto;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:10px 14px;max-width:440px}
.brand .eyebrow{font:500 11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:2px 0 0;font-size:19px;letter-spacing:-.01em}
nav.worlds{pointer-events:auto;display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:6px}
nav.worlds button,.btn{font:500 12.5px system-ui,sans-serif;border:1px solid transparent;background:transparent;color:var(--ink);padding:6px 11px;border-radius:8px;cursor:pointer}
nav.worlds button[aria-pressed="true"]{background:var(--accent);color:#fff}
nav.worlds button:hover{border-color:var(--line)}
.btn{border-color:var(--line);background:var(--panel-solid)}
.btn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
aside#panel{position:fixed;right:16px;top:86px;bottom:16px;width:min(380px,calc(100vw - 32px));overflow:auto;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:14px 16px;z-index:4;transition:transform .35s ease}
aside#panel.hidden{transform:translateX(calc(100% + 24px))}
aside h2{margin:2px 0 6px;font-size:16px}
aside h3{margin:14px 0 6px;font-size:13px;letter-spacing:.02em;color:var(--muted);text-transform:uppercase;font-weight:600}
aside p{margin:0 0 8px;color:var(--ink)}
.verdict{display:inline-block;font:600 11.5px ui-monospace,monospace;padding:2px 9px;border-radius:999px;margin:2px 0 6px}
.v-reached{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.v-close{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.v-not{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin:4px 0 6px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font:500 10.5px ui-monospace,monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.note{font-size:12px;color:var(--muted)}
.cbar{height:10px;border-radius:5px;margin:4px 0 2px}
.cbar-l{display:flex;justify-content:space-between;font:11px ui-monospace,monospace;color:var(--muted)}
#controls{position:fixed;left:16px;bottom:16px;right:min(412px,calc(100vw - 16px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:8px 10px;z-index:4}
#controls label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12.5px}
#controls input[type=range]{width:min(320px,40vw)}
#caption{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);max-width:min(640px,calc(100vw - 32px));background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14.5px;z-index:6;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center}
#caption.on{opacity:1}
.lbl{font:600 11px ui-monospace,monospace;color:var(--ink);background:var(--glass);border:1px solid var(--line);padding:1px 6px;border-radius:6px;white-space:nowrap;pointer-events:none}
.lbl.small{font-weight:500;font-size:10px;padding:0 4px}
.lbl.axis{background:transparent;border:0;color:var(--muted)}
.lbl.hl{border-color:var(--accent);color:var(--accent)}
canvas.chart{width:100%;height:auto;display:block;background:transparent}
#toggle-panel{display:none}
@media (max-width:760px){
  aside#panel{top:auto;height:44vh;bottom:76px;right:16px}
  #controls{right:16px}
  .brand{max-width:none}
  #toggle-panel{display:inline-block}
  nav.worlds{margin-left:0}
  header{flex-direction:column}
}
</style>

<body>
<div id="stage"></div>
<header>
  <div class="brand">
    <div class="eyebrow">qBraid · open simulation · materials</div>

</header>
<aside id="panel"></aside>
<div id="controls"></div>
<div id="caption"></div>

      <canvas class="chart" id="arr"></canvas>
      <table><tr><th>T (K)</th><th>D_Li (cm²/s)</th><th>MD steps/s</th></tr>${(A.T || []).map((t, i) => `<tr><td>${t}</td><td>${A.D[i].toExponential(2)}</td><td>${A.sps[i].toFixed(0)}</td></tr>`).join('')}</table>
      <p>${M.note || ''}</p>
      <h3>Temperature</h3><div class="row">${temps.map(t => `<button class="btn" data-t="${t}" aria-pressed="${t === T}">${t} K</button>`).join('')}</div>`;
    chart = $('#arr'); drawArr();
    $('#panel').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { T = b.dataset.t; fpos = 0; panel(); });
  }
  function mdTheme() { const dk = isDark(); const li = groups.Li.im.material;
    li.color.set(dk ? 0xb9a2ff : 0x6d3df5); li.emissive.set(dk ? 0x7c4dff : 0x3b1a9e); li.emissiveIntensity = dk ? 0.9 : 0.35;
    tmesh.material.opacity = dk ? .32 : .5; tmesh.material.color.set(dk ? 0xff9a3c : 0xe07b1a);
    trails.material.blending = dk ? THREE.AdditiveBlending : THREE.NormalBlending; trails.material.needsUpdate = true; drawArr(); }
  return { name: 'Li-ion MD', G, bloom: [0.55, 0.08], theme: mdTheme,
    enter() { flyTo([34, 21, 38], [0, 0, 0]); panel();
      controlsHTML(`<button class="btn" id="pp">Pause</button><label>time <input type="range" id="scrub" min="0" max="1000" value="0"></label><label>speed <input type="range" id="spd" min="0.2" max="4" step="0.1" value="1"></label><span class="note mono" id="tlab"></span>`);
      $('#pp').onclick = () => { playing = !playing; $('#pp').textContent = playing ? 'Pause' : 'Play'; };
      $('#scrub').oninput = e => { fpos = e.target.value / 1000 * (M.runs[T].nframes - 1); };
      $('#spd').oninput = e => speed = +e.target.value; },
    update(t, dt) { const r = M.runs[T]; if (playing) fpos = (fpos + dt * 6 * speed) % (r.nframes - 1);
      const sc = $('#scrub'); if (sc && playing) sc.value = Math.round(fpos / (r.nframes - 1) * 1000);
      const tl = $('#tlab'); if (tl) tl.textContent = `${(fpos * r.dt_ps).toFixed(1)} ps @ ${T} K`;
      Object.values(groups).forEach(g => { g.ids.forEach((i, k) => { posAt(T, fpos, i, tmp); _m.makeScale(g.r, g.r, g.r); _m.setPosition(tmp); g.im.setMatrixAt(k, _m); }); g.im.instanceMatrix.needsUpdate = true; });
      const tp = tg.attributes.position.array; let o = 0;
      tetra.forEach(([p, a, b, c, d]) => { const V = [a, b, c, d].map(i => { posAt(T, fpos, i, tmp2); posAt(T, fpos, p, tmp); const v = tmp2.clone(); for (let k = 0; k < 3; k++) { const L = cell[k][k]; let dd = v.getComponent(k) - tmp.getComponent(k); dd -= L * Math.round(dd / L); v.setComponent(k, tmp.getComponent(k) + dd); } return v; });
        [[0, 1, 2], [0, 1, 3], [0, 2, 3], [1, 2, 3]].forEach(f => f.forEach(j => { tp[o++] = V[j].x; tp[o++] = V[j].y; tp[o++] = V[j].z; })); });
      tg.attributes.position.needsUpdate = true; tg.computeVertexNormals();
      const base = new THREE.Color(0xa78bfa); let w = 0;
      LiIds.forEach((i) => { for (let s = 0; s < TL; s++) { const f0 = Math.max(0, fpos - (s + 1) * .5), f1 = Math.max(0, fpos - s * .5);
        posAt(T, f0, i, tmp); posAt(T, f1, i, tmp2); const jump = tmp.distanceTo(tmp2) > 3; const a = jump ? 0 : (1 - s / TL) * .9;
        tpos.set([tmp.x, tmp.y, tmp.z, tmp2.x, tmp2.y, tmp2.z], w * 6); tcol.set([base.r * a, base.g * a, base.b * a, base.r * a, base.g * a, base.b * a], w * 6); w++; } });
      trg.attributes.position.needsUpdate = true; trg.attributes.color.needsUpdate = true;
      G.rotation.y += dt * .03; },
    tour: [{ pos: [34, 21, 38], tgt: [0, 0, 0], text: 'A solid that conducts lithium like a liquid. The trails show lithium ions hopping between cages while the PS₄ framework only rattles.' },
           { pos: [14, 7, 16], tgt: [0, 0, 0], text: 'Repeating this at three temperatures gives the activation energy, the number battery chemists screen for.' }] };
}

// ---------- assemble ----------
worlds.push(makeDiscovery(), makeCrystals(), makePhonons(), makeMD());
let active = -1;
function controlsHTML(h) { $('#controls').innerHTML = h + ` <span style="flex:1"></span><button class="btn primary" id="tourb">Guided tour</button><button class="btn" id="themeb" title="Toggle light/dark">Theme</button><button class="btn" id="toggle-panel">Info</button>`;
  $('#tourb').onclick = startTour; $('#themeb').onclick = () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; applyTheme(); worlds[active] && worlds[active].enter && worlds[active].theme && worlds[active].theme(); };
  $('#toggle-panel').onclick = () => { $('#panel').classList.toggle('hidden'); resize(); }; }
function show(i, fly = true) { if (active >= 0) worlds[active].G.visible = false; active = i; worlds[i].G.visible = true; worlds[i].enter(); applyTheme();
  document.querySelectorAll('#worlds button').forEach((b, k) => b.setAttribute('aria-pressed', k === i));
  try { localStorage.setItem('mat-world', i); } catch (e) {} if (location.hash !== '#' + i) history.replaceState(null, '', '#' + i); }
worlds.forEach((w, i) => { const b = document.createElement('button'); b.textContent = w.name; b.onclick = () => { stopTour(); show(i); }; $('#worlds').appendChild(b); });

// guided tour
let tour = null;
function startTour() { const steps = []; worlds.forEach((w, i) => w.tour.forEach(s => steps.push({ ...s, w: i }))); tour = { steps, k: -1, next: 0 }; nextStep(); }
function stopTour() { tour = null; $('#caption').classList.remove('on'); }
function nextStep() { if (!tour) return; tour.k++; if (tour.k >= tour.steps.length) { stopTour(); return; } const s = tour.steps[tour.k];
  if (s.w !== active) show(s.w); setTimeout(() => flyTo(s.pos, s.tgt, 2.2), 60); $('#caption').textContent = s.text; $('#caption').classList.add('on'); tour.next = NOW + 6500; }
renderer.domElement.addEventListener('pointerdown', () => { if (tour) stopTour(); });

// loop
let last = performance.now(), t0 = last, running = true;
document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) { last = performance.now(); requestAnimationFrame(loop); } });
function loop(now) { if (!running) return; NOW = now; const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; const t = (now - t0) / 1000;
  if (flight) { const f = Math.min(1, (now - flight.s) / flight.d), e = ease(f); camera.position.lerpVectors(flight.p0, flight.p1, e); controls.target.lerpVectors(flight.t0, flight.t1, e); if (f >= 1) flight = null; }
  if (tour && now > tour.next) nextStep();
  if (active >= 0) worlds[active].update(t, dt);
  controls.update(); composer.render(); labelRenderer.render(scene, camera); requestAnimationFrame(loop); }
resize(); applyTheme();
let start = 0; try { start = +(localStorage.getItem('mat-world') || 0); } catch (e) {}
const h = parseInt(location.hash.slice(1)); if (!isNaN(h) && worlds[h]) start = h;
show(Math.min(start, worlds.length - 1));
if (location.search.includes('theme=light')) { document.documentElement.dataset.theme = 'light'; applyTheme(); }
if (location.search.includes('theme=dark')) { document.documentElement.dataset.theme = 'dark'; applyTheme(); }
requestAnimationFrame(loop);
</script>
</body>
