# cfd-stack: OpenFOAM v2412 + gmsh + pyvista, as verified on 2026-09-30.
# Create:  micromamba create -p <prefix> -f environment.yml
# About 3.4 GB installed. Put it on the overlay (/tmp) or package it as a qBraid env, not in $HOME.
name: cfd
channels:
  - conda-forge
dependencies:
  - python=3.12.14
  - openfoam=2412
  - mpich=4.3.2
  - gmsh=4.15.2
  - python-gmsh=4.15.2
  - pyvista=0.49.0
  - vtk-base=9.6.2
  - numpy=2.5.3
  - scipy=1.18.1
  - matplotlib=3.11.2
